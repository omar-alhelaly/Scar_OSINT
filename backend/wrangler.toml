name = "osint-engine"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[[d1_databases]]
binding = "DB"
database_name = "osint-db"
database_id = "0dd72f0f-4a1e-4f0f-8e81-47b77192f771"

[[queues.producers]]
binding = "SCAN_QUEUE"
queue = "osint-scan-queue"

[[queues.consumers]]
queue = "osint-scan-queue"
max_batch_size = 5
max_batch_timeout = 2
max_retries = 3
max_concurrency = 5
